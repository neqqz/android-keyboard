name: Build Stable APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Pull LFS files in submodules
        run: git submodule foreach --recursive 'git lfs pull || true'

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK/NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Python deps for locale generation
        run: pip install requests

      - name: Signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > key.jks
          printf '%s\n' "$LOCAL_PROPERTIES" | tr -d '\r' > signing.properties
          p() { grep -m1 "^$1=" signing.properties | cut -d= -f2-; }
          {
            echo "storeFile=key.jks"
            echo "storePassword=$(p KEYSTORE_PASS)"
            echo "keyAlias=$(p ALIAS_NAME)"
            echo "keyPassword=$(p ALIAS_PASS)"
          } > keystore.properties
          rm -f signing.properties

      - name: Build
        run: |
          export VERSION_CODE=$(( $(date +%s) / 60 ))
          export VERSION_NAME="$(git describe --tags --always)-custom"
          export BRANCH_NAME="${GITHUB_REF_NAME}"
          chmod +x gradlew
          ./gradlew assembleStableRelease -s

      - name: Cleanup secrets
        if: always()
        run: rm -f key.jks keystore.properties signing.properties

      - uses: actions/upload-artifact@v7
        with:
          name: futo-keyboard-stable
          path: build/outputs/apk/stable/release/*.apk
          if-no-files-found: error
